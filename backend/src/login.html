<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>우리의 여행 · 로그인</title>
<style>
:root{color-scheme:light;--ink:#203832;--accent:#236b58}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f7f4;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;display:grid;place-items:center;padding:24px 16px}.window{width:min(100%,430px);background:#fff;border:1px solid #dce5df;border-radius:18px;box-shadow:0 10px 50px #23443108;overflow:hidden}.bar{padding:17px 24px;background:#f8faf7;border-bottom:1px solid #e7ede7;display:flex;justify-content:space-between;font:650 10px system-ui;letter-spacing:1.2px;color:#6e8677}.bar>span:last-child{display:none}.body{padding:28px}.sticker{display:block;width:48px;height:48px;margin:0 0 20px;image-rendering:pixelated}h1{font-size:25px;letter-spacing:-1px;margin:0 0 10px}p{font-size:14px;line-height:1.8;margin:0 0 22px;color:#738276}label{font-size:13px;font-weight:650;display:block;margin:18px 0 7px}input{display:block;width:100%;min-height:48px;border:1px solid #d6e1d7;border-radius:9px;background:#fff;padding:12px;font:16px system-ui;color:var(--ink)}input:focus{outline:3px solid #a6cdb5;outline-offset:2px}input[readonly]{background:#f5f7f1}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:650 15px system-ui;cursor:pointer}button:hover{background:#18513f}button:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;margin:8px 0 0}.status{margin:16px 0 0;font-size:13px;min-height:22px;color:#a2503c}.back{display:block;text-align:center;color:#637e65;font-size:13px;padding:20px 0 0;min-height:44px}small{display:block;text-align:center;font:10px system-ui;letter-spacing:1.4px;margin:25px 0 2px;color:#96a58e}[hidden]{display:none!important}
</style></head><body><main class="window"><div class="bar"><span>POCKET TRIP / LOGIN</span><span aria-hidden="true">♡ ▧ ×</span></div><div class="body">
<svg class="sticker" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><path fill="#fac8d4" d="M3 12h26v17H3z"/><path fill="#587c73" d="M5 2h5v10H5zm17 0h5v10h-5zM3 12h26v2H3zm0 2h2v13H3zm24 0h2v13h-2zM5 27h22v2H5z"/><path fill="#fff9e6" d="M7 4h2v10H7zm16 0h2v10h-2zM7 14h18v11H7z"/><path fill="#587c73" d="M10 17h2v3h-2zm10 0h2v3h-2zm-6 4h4v2h-4z"/><path fill="#f0a8b9" d="M8 21h3v2H8zm13 0h3v2h-3z"/></svg>
<h1 id="title">우리의 여행, 이어서 ♡</h1><p id="intro">허용된 이메일과 플래너 전용 비밀번호로 로그인하세요.</p>
<form id="form"><label for="email">로그인 이메일</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" autocapitalize="none" spellcheck="false">
<div id="current-wrap" hidden><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" maxlength="128"></div>
<label for="password" id="password-label">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
<div id="confirm-wrap" hidden><label for="confirm">새 비밀번호 한 번 더</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"><p class="hint">15자 이상으로 설정해 주세요. 다른 사이트와 다른 비밀번호를 사용하세요.</p></div>
<button id="submit" type="submit">여행 관리 시작 →</button><p id="status" class="status" role="status" aria-live="polite"></p></form>
<a class="back" href="https://toviworktest.github.io/phuquoc-pocket-trip/">로그인 없이 일정 둘러보기</a><small>SMALL PLANS, LOVELY DAYS.</small></div></main>
<script>
(()=>{
 const $=id=>document.getElementById(id),fragment=new URLSearchParams(location.hash.slice(1));
 let token=fragment.get('invite')||'',inviteEmail=fragment.get('email')||'';
 const change=new URLSearchParams(location.search).get('mode')==='change',invite=!!token&&!change;
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 if(invite||change){$('confirm-wrap').hidden=false;$('confirm').required=true;$('password').minLength=15;$('password').autocomplete='new-password';$('password-label').textContent='새 비밀번호';}
 if(invite){$('title').textContent='우리 여행에 오신 걸 환영해요';$('intro').textContent='초대받은 이메일로 사용할 비밀번호를 처음 설정해 주세요.';$('email').value=inviteEmail;$('email').readOnly=true;$('submit').textContent='비밀번호 설정하고 시작 ♡';}
 if(change){$('title').textContent='비밀번호 바꾸기';$('intro').textContent='새 비밀번호를 저장하면 다른 기기의 로그인은 해제돼요.';$('current-wrap').hidden=false;$('current').required=true;$('email').hidden=true;$('email').required=false;document.querySelector('label[for=email]').hidden=true;$('submit').textContent='새 비밀번호 저장';}
 $('form').onsubmit=async event=>{
  event.preventDefault();$('status').textContent='';
  if((invite||change)&&$('password').value!==$('confirm').value){$('status').textContent='새 비밀번호가 서로 달라요.';return;}
  $('submit').disabled=true;
  try{
   const path=change?'change-password':invite?'sign-up/email':'sign-in/email';
   const body=change?{currentPassword:$('current').value,newPassword:$('password').value,revokeOtherSessions:true}:{email:$('email').value.trim(),password:$('password').value,...(invite?{name:'여행 멤버'}:{})};
   const response=await fetch('/api/auth/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',...(invite?{'X-Invite-Token':token}:{})},body:JSON.stringify(body)});
   if(!response.ok){$('status').textContent=response.status===429?'잠시 쉬어 가요. 1분 뒤 다시 시도해 주세요.':invite?'초대 링크가 만료되었거나 이미 등록된 계정이에요. 기존 계정은 일반 로그인 화면을 이용해 주세요.':change?'현재 비밀번호와 로그인 상태를 확인해 주세요.':'이메일 또는 비밀번호를 확인해 주세요.';return;}
   token='';$('password').value='';$('confirm').value='';$('current').value='';location.replace('/');
  }catch{$('status').textContent='서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';}finally{$('submit').disabled=false;}
 };
})();
</script></body></html>
